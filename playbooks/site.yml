---
- name: Install isolated vulnerability research control plane
  hosts: research
  become: true
  gather_facts: true
  vars_files:
    - "{{ playbook_dir }}/../group_vars/all.yml"

  pre_tasks:
    - name: Require Ubuntu 24.04 x86-64
      ansible.builtin.assert:
        that:
          - ansible_facts['distribution'] == 'Ubuntu'
          - ansible_facts['distribution_version'] == '24.04'
          - ansible_facts['architecture'] == 'x86_64'
        fail_msg: "Use the Ubuntu 24.04 LTS x86-64 image; adjust and test for other platforms."

    - name: Require explicit Slipcage-smol bootstrap before any Ansible changes
      ansible.builtin.stat:
        path: /etc/slipcage/release-channel
        follow: false
      register: smol_channel_marker

    - name: Reject hosts without a private root-owned smol channel marker
      ansible.builtin.assert:
        that:
          - smol_channel_marker.stat.isreg | default(false)
          - smol_channel_marker.stat.pw_name | default('') == 'root'
          - smol_channel_marker.stat.mode | default('') == '0600'
        fail_msg: "Smol playbook refuses unbootstrapped/legacy Slipcage hosts. Use a separate fresh Ubuntu 24.04 VPS."

    - name: Read the existing smol channel identity
      ansible.builtin.slurp:
        src: /etc/slipcage/release-channel
      register: smol_channel_contents

    - name: Refuse mixed original and smol release channels
      ansible.builtin.assert:
        that:
          - (smol_channel_contents.content | b64decode | trim) == 'soybeanfarmer/slipcage-smol'
        fail_msg: "This host is not registered for the independent smol release channel."

    - name: Detect existing Dagu installation
      ansible.builtin.stat:
        path: /etc/systemd/system/isolab-dagu.service
      register: existing_dagu

    - name: Detect deployment barrier
      ansible.builtin.stat:
        path: /usr/local/bin/slipcage-guard
      register: existing_guard

    - name: Enter maintenance and drain guarded research jobs
      ansible.builtin.command:
        argv:
          - /usr/local/bin/slipcage-guard
          - begin
          - --wait-seconds
          - "{{ deploy_drain_seconds | string }}"
      when: existing_guard.stat.exists
      changed_when: true

  tasks:
    - name: Detect retired candidate database before stopping research
      ansible.builtin.stat:
        path: /srv/isolab/research.sqlite3
        follow: false
      register: legacy_research_db

    - name: Detect previous SQLite backup helper
      ansible.builtin.stat:
        path: /usr/local/sbin/slipcage-backup
      register: legacy_backup_helper

    - name: Detect prior final legacy archive marker
      ansible.builtin.stat:
        path: /var/backups/slipcage/research-retired.snapshot-complete
      register: research_archive_marker

    - name: Require ability to preserve existing database before retiring it
      ansible.builtin.assert:
        that:
          - not (legacy_research_db.stat.exists | default(false)) or (legacy_research_db.stat.isreg | default(false))
          - not (legacy_research_db.stat.exists | default(false)) or (legacy_backup_helper.stat.exists | default(false)) or (research_archive_marker.stat.exists | default(false))
        fail_msg: "Research DB exists but no prior backup helper is available; refusing retirement."

    - name: Preserve final legacy research SQLite and Markdown reports snapshot
      ansible.builtin.command:
        argv:
          - /usr/local/sbin/slipcage-backup
          - create
          - --db
          - /srv/isolab/research.sqlite3
          - --reports
          - /srv/isolab/reports
          - --destination
          - /var/backups/slipcage
          - --keep
          - "90"
      when:
        - legacy_research_db.stat.isreg | default(false)
        - legacy_backup_helper.stat.exists | default(false)
        - not (research_archive_marker.stat.exists | default(false))
      changed_when: true

    - name: Mark successfully archived historical research
      ansible.builtin.copy:
        content: "Legacy research SQLite and reports archived before retirement. Do not prune format-1 backups automatically.\n"
        dest: /var/backups/slipcage/research-retired.snapshot-complete
        owner: root
        group: root
        mode: '0600'
      when:
        - legacy_research_db.stat.isreg | default(false)
        - not (research_archive_marker.stat.exists | default(false))

    - name: Disable legacy discovery and review timers
      ansible.builtin.command: systemctl disable --now slipcage-discover.timer slipcage-review.timer
      changed_when: false
      failed_when: false

    - name: Clear stale failed-state records for retired research workers
      ansible.builtin.command: systemctl reset-failed slipcage-discover.service slipcage-review.service
      changed_when: false
      failed_when: false

    - name: Remove obsolete discovery and review unit and application files
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /etc/systemd/system/slipcage-discover.timer
        - /etc/systemd/system/slipcage-discover.service
        - /etc/systemd/system/slipcage-review.timer
        - /etc/systemd/system/slipcage-review.service
        - /opt/isolab/app/isolab.py
        - /opt/isolab/app/intelligence.py
        - /opt/isolab/app/recovery.py
        - /opt/isolab/app/local_review.py
        - /opt/isolab/scripts/discover.sh

    - name: Stop legacy Dagu before enabling native timers
      ansible.builtin.command: systemctl disable --now isolab-dagu.service
      changed_when: false
      failed_when: false
      when: existing_dagu.stat.exists

    - name: Stop obsolete Dagu review recovery timer
      ansible.builtin.command: systemctl disable --now slipcage-recover.timer
      changed_when: false
      failed_when: false

    - name: Remove legacy Dagu and recovery unit files
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /etc/systemd/system/isolab-dagu.service
        - /etc/systemd/system/slipcage-recover.service
        - /etc/systemd/system/slipcage-recover.timer
        - /usr/local/bin/dagu

    - name: Install core packages
      ansible.builtin.apt:
        name:
          - ca-certificates
          - curl
          - git
          - python3
          - python3-venv
          - python3-pip
          - busybox-static
          - cpio
          - sqlite3
          - jq
          - unzip
          - tar
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: Create deployment state directory
      ansible.builtin.file:
        path: /var/lib/slipcage
        state: directory
        owner: root
        group: root
        mode: '0755'

    - name: Create root-owned deployment lock
      ansible.builtin.file:
        path: /var/lib/slipcage/deployment.lock
        state: touch
        owner: root
        group: root
        mode: '0644'
        modification_time: preserve
        access_time: preserve

    - name: Install deployment barrier
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../scripts/slipcage-guard.py"
        dest: /usr/local/bin/slipcage-guard
        owner: root
        group: root
        mode: '0755'

    - name: Refresh release puller from approved CI-validated snapshot
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../scripts/pull-deploy.sh"
        dest: /usr/local/sbin/slipcage-pull-deploy
        owner: root
        group: root
        mode: '0755'
      # Bootstrap installs the initial puller, but every approved release
      # must refresh it too. Atomic copy leaves an in-flight old process on
      # its original inode; the next invocation uses this checked version.

    - name: Install optional QEMU analysis and build tools
      ansible.builtin.apt:
        name:
          - clang
          - gcc
          - g++
          - make
          - ninja-build
          - meson
          - pkg-config
          - libglib2.0-dev
          - libpixman-1-dev
          - qemu-system-x86
          - qemu-utils
          - gdb
        state: present
      when: install_research_toolchain | bool

    - name: Create locked-down research group
      ansible.builtin.group:
        name: "{{ research_group }}"
        system: true

    - name: Create unprivileged research user
      ansible.builtin.user:
        name: "{{ research_user }}"
        group: "{{ research_group }}"
        shell: /usr/sbin/nologin
        home: /var/lib/isolab
        create_home: false
        system: true
        password_lock: true

    - name: Ensure KVM device-access group exists
      ansible.builtin.group:
        name: kvm
        system: true

    - name: Create dedicated VM probe group
      ansible.builtin.group:
        name: slipcage-vmprobe
        system: true

    - name: Create isolated, unprivileged VM probe account
      ansible.builtin.user:
        name: slipcage-vmprobe
        group: slipcage-vmprobe
        groups: kvm
        append: true
        shell: /usr/sbin/nologin
        home: /nonexistent
        create_home: false
        system: true
        password_lock: true

    - name: Create application directories
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: directory
        owner: "{{ item.owner }}"
        group: "{{ item.group }}"
        mode: "{{ item.mode }}"
      loop:
        - { path: '/opt/isolab', owner: 'root', group: 'root', mode: '0755' }
        - { path: '/opt/isolab/app', owner: 'root', group: 'root', mode: '0755' }
        - { path: '/srv/isolab', owner: 'isolab', group: 'isolab', mode: '0700' }
        - { path: '/srv/isolab/reports', owner: 'isolab', group: 'isolab', mode: '0700' }

    - name: Install server verification helper
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../scripts/verify-server.sh"
        dest: /opt/isolab/verify-server.sh
        owner: root
        group: root
        mode: '0755'

    - name: Create private on-server backup directory
      ansible.builtin.file:
        path: /var/backups/slipcage
        state: directory
        owner: root
        group: root
        mode: '0700'

    - name: Install validated backup helper
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../scripts/slipcage-backup.py"
        dest: /usr/local/sbin/slipcage-backup
        owner: root
        group: root
        mode: '0755'

    - name: Install hardened backup systemd service
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../systemd/slipcage-backup.service"
        dest: /etc/systemd/system/slipcage-backup.service
        owner: root
        group: root
        mode: '0644'

    - name: Create first reports-only snapshot after preservation of legacy SQLite
      ansible.builtin.command:
        argv:
          - /usr/local/sbin/slipcage-backup
          - create-reports
          - --reports
          - /srv/isolab/reports
          - --destination
          - /var/backups/slipcage
          - --keep
          - "14"
      changed_when: true

    - name: Install daily backup timer
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../systemd/slipcage-backup.timer"
        dest: /etc/systemd/system/slipcage-backup.timer
        owner: root
        group: root
        mode: '0644'

    - name: Enable scheduled Slipcage backups
      ansible.builtin.systemd_service:
        name: slipcage-backup.timer
        daemon_reload: true
        enabled: true
        state: started

    - name: Install non-destructive restore drill tool
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../scripts/slipcage-restore-check.py"
        dest: /usr/local/sbin/slipcage-restore-check
        owner: root
        group: root
        mode: '0755'

    - name: Create root-owned readiness script directory
      ansible.builtin.file:
        path: /usr/local/lib/slipcage
        state: directory
        owner: root
        group: root
        mode: '0755'

    - name: Install reproducible microguest initramfs builder
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../scripts/build-microguest.sh"
        dest: /usr/local/lib/slipcage/build-microguest
        owner: root
        group: root
        mode: '0755'

    - name: Build a disposable, networkless initramfs from distro busybox-static
      ansible.builtin.command:
        argv:
          - /usr/local/lib/slipcage/build-microguest
        creates: /usr/local/lib/slipcage/microguest.cpio.gz

    - name: Stage running Ubuntu kernel for unprivileged microguest boot
      ansible.builtin.copy:
        src: "/boot/vmlinuz-{{ ansible_facts['kernel'] }}"
        dest: "/usr/local/lib/slipcage/vmlinuz-{{ ansible_facts['kernel'] }}"
        remote_src: true
        owner: root
        group: root
        mode: '0644'

    - name: Install KVM readiness probe (manual only)
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../scripts/slipcage-kvm-probe.py"
        dest: /usr/local/lib/slipcage/kvm-probe.py
        owner: root
        group: root
        mode: '0755'

    - name: Install sandboxed manual KVM probe unit
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../systemd/slipcage-kvm-probe.service"
        dest: /etc/systemd/system/slipcage-kvm-probe.service
        owner: root
        group: root
        mode: '0644'

    - name: Install sandboxed, manual microguest boot unit
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../systemd/slipcage-kvm-boot.service"
        dest: /etc/systemd/system/slipcage-kvm-boot.service
        owner: root
        group: root
        mode: '0644'

    - name: Install fixed-command disposable guest lifecycle supervisor
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../scripts/slipcage-guest-lifecycle.py"
        dest: /usr/local/lib/slipcage/guest-lifecycle.py
        owner: root
        group: root
        mode: '0755'

    - name: Install manual only nested guest cycle template
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../systemd/slipcage-guest-cycles@.service"
        dest: /etc/systemd/system/slipcage-guest-cycles@.service
        owner: root
        group: root
        mode: '0644'

    - name: Install deterministic fixed arithmetic and hash guest builder
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../scripts/build-experiment-guest.sh"
        dest: /usr/local/lib/slipcage/build-experiment-guest
        owner: root
        group: root
        mode: '0755'

    - name: Build inert arithmetic and SHA-256 Linux guest image
      ansible.builtin.command:
        argv:
          - /usr/local/lib/slipcage/build-experiment-guest
        creates: /usr/local/lib/slipcage/experiment-v1.cpio.gz

    - name: Install manual controlled experiment systemd template
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../systemd/slipcage-experiment@.service"
        dest: /etc/systemd/system/slipcage-experiment@.service
        owner: root
        group: root
        mode: '0644'

    - name: Install reviewed fixed experiment consumer
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../scripts/slipcage-experiment-consumer.py"
        dest: /usr/local/lib/slipcage/experiment-consumer.py
        owner: root
        group: root
        mode: '0755'

    - name: Install bounded experiment family planner
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../scripts/slipcage-family-expand.py"
        dest: /usr/local/lib/slipcage/family-expand.py
        owner: root
        group: root
        mode: '0755'

    - name: Replace previous release experiment families
      ansible.builtin.file:
        path: /usr/local/lib/slipcage/families
        state: absent

    - name: Create root-owned approved experiment family directory
      ansible.builtin.file:
        path: /usr/local/lib/slipcage/families
        owner: root
        group: root
        state: directory
        mode: '0755'

    - name: Install approved experiment families from the release snapshot
      ansible.builtin.copy:
        src: "{{ item }}"
        dest: "/usr/local/lib/slipcage/families/{{ item | basename }}"
        owner: root
        group: root
        mode: '0644'
      loop: "{{ query('fileglob', playbook_dir + '/../families/FAM-*.json') }}"

    - name: Remove previous release's approved experiment manifests only
      ansible.builtin.file:
        path: /usr/local/lib/slipcage/experiments
        state: absent

    - name: Create root-owned approved experiment manifest directory
      ansible.builtin.file:
        path: /usr/local/lib/slipcage/experiments
        owner: root
        group: root
        state: directory
        mode: '0755'

    - name: Install approved experiment manifests from the release snapshot
      ansible.builtin.copy:
        src: "{{ item }}"
        dest: "/usr/local/lib/slipcage/experiments/{{ item | basename }}"
        owner: root
        group: root
        mode: '0644'
      loop: "{{ query('fileglob', playbook_dir + '/../experiments/EXP-*.json') }}"

    - name: Expand reviewed experiment families into bounded queue items
      ansible.builtin.command:
        argv:
          - /usr/local/lib/slipcage/family-expand.py
          - --families
          - /usr/local/lib/slipcage/families
          - --experiments
          - /usr/local/lib/slipcage/experiments
      changed_when: false

    - name: Install sandboxed experiment consumer and optional timer
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../systemd/{{ item }}"
        dest: "/etc/systemd/system/{{ item }}"
        owner: root
        group: root
        mode: '0644'
      loop:
        - slipcage-experiment-consumer.service
        - slipcage-experiment-consumer.timer

    - name: Install vetted sanitized results publisher
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../scripts/slipcage-results-publisher.py"
        dest: /usr/local/lib/slipcage/results-publisher.py
        owner: root
        group: root
        mode: '0755'

    - name: Install manual-only isolated GitHub result PR service
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../systemd/slipcage-results-publisher.service"
        dest: /etc/systemd/system/slipcage-results-publisher.service
        owner: root
        group: root
        mode: '0644'
      # No timer, enabled service, GitHub credentials, or guest work.

    - name: Create private publication receipt directory
      ansible.builtin.file:
        path: /var/lib/slipcage-results-publisher
        state: directory
        owner: root
        group: root
        mode: '0700'

    - name: Install read-only guest evidence audit tool
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../scripts/slipcage-experiment-audit.py"
        dest: /usr/local/lib/slipcage/experiment-audit.py
        owner: root
        group: root
        mode: '0755'

    - name: Install passive runtime quota configuration check
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../scripts/slipcage-limits-check.py"
        dest: /usr/local/lib/slipcage/limits-check.py
        owner: root
        group: root
        mode: '0755'

    - name: Install manual read-only guest evidence audit unit
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../systemd/slipcage-experiment-audit.service"
        dest: /etc/systemd/system/slipcage-experiment-audit.service
        owner: root
        group: root
        mode: '0644'

    - name: Install manual guest-free fault drill runner
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../scripts/slipcage-fault-drill.py"
        dest: /usr/local/lib/slipcage/fault-drill.py
        owner: root
        group: root
        mode: '0755'

    - name: Install disabled-by-default manual fault drill template
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../systemd/slipcage-fault-drill@.service"
        dest: /etc/systemd/system/slipcage-fault-drill@.service
        owner: root
        group: root
        mode: '0644'

    - name: Install passive Slipcage health checker
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../scripts/slipcage-health.py"
        dest: /usr/local/lib/slipcage/health.py
        owner: root
        group: root
        mode: '0755'

    - name: Install manual dry-run fault artifact retention tool
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../scripts/slipcage-fault-retention.py"
        dest: /usr/local/lib/slipcage/fault-retention.py
        owner: root
        group: root
        mode: '0755'

    - name: Install sandboxed health check unit
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../systemd/slipcage-health.service"
        dest: /etc/systemd/system/slipcage-health.service
        owner: root
        group: root
        mode: '0644'

    - name: Install hourly read-only health timer
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../systemd/slipcage-health.timer"
        dest: /etc/systemd/system/slipcage-health.timer
        owner: root
        group: root
        mode: '0644'

    - name: Enable bounded read-only operational health checks
      ansible.builtin.systemd_service:
        name: slipcage-health.timer
        daemon_reload: true
        enabled: true
        state: started

    - name: Install bounded read-only local backup restore assurance runner
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../scripts/slipcage-assurance.py"
        dest: /usr/local/lib/slipcage/assurance.py
        owner: root
        group: root
        mode: '0755'

    - name: Install weekly sandboxed local backup assurance unit
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../systemd/slipcage-assurance.service"
        dest: /etc/systemd/system/slipcage-assurance.service
        owner: root
        group: root
        mode: '0644'

    - name: Install weekly local backup assurance timer
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../systemd/slipcage-assurance.timer"
        dest: /etc/systemd/system/slipcage-assurance.timer
        owner: root
        group: root
        mode: '0644'

    - name: Enable bounded weekly local backup assurance
      ansible.builtin.systemd_service:
        name: slipcage-assurance.timer
        daemon_reload: true
        enabled: true
        state: started

    - name: Protect private smol release-channel configuration
      ansible.builtin.file:
        path: /etc/slipcage
        state: directory
        owner: root
        group: root
        mode: '0700'

    - name: Reload systemd for installed manual-only units
      ansible.builtin.systemd_service:
        daemon_reload: true

    - name: Release deployment maintenance after health checks
      ansible.builtin.command: /usr/local/bin/slipcage-guard end
      when: existing_guard.stat.exists
      changed_when: true

    - name: Display final message
      ansible.builtin.debug:
        msg:
          - "Advisory discovery/review timers retired; research is operator-led."
          - "Old SQLite and reports preserved; new backups contain reports only."
          - "Approved experiment consumer installed; timer disabled until operator opts in."
          - "Check: systemctl list-timers 'slipcage-*' --no-pager"

